<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" width="600" height="520">
  <defs>
    <radialGradient id="glow" cx="50%" cy="55%" r="55%">
      <stop offset="0" stop-color="#E4EAFF"/>
      <stop offset="0.65" stop-color="#EEF2FF"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bowl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A6CF7"/>
      <stop offset="1" stop-color="#2D47C9"/>
    </linearGradient>
    <linearGradient id="bowlRim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#DCE4FF"/>
      <stop offset="1" stop-color="#F4F7FF"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9BD27A"/>
      <stop offset="1" stop-color="#5FAE5A"/>
    </linearGradient>
    <linearGradient id="leaf2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B7DE8F"/>
      <stop offset="1" stop-color="#78BD62"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#DDE6FF" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#17213B" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- soft background -->
  <ellipse cx="300" cy="290" rx="290" ry="225" fill="url(#glow)"/>
  <circle cx="92" cy="128" r="46" fill="#FFF1DC" filter="url(#soft)" opacity="0.9"/>
  <circle cx="520" cy="170" r="38" fill="#E3F4D7" filter="url(#soft)" opacity="0.9"/>
  <circle cx="500" cy="420" r="30" fill="#FFE3E0" filter="url(#soft)" opacity="0.8"/>

  <!-- sparkles -->
  <g fill="#355AF4" opacity="0.55">
    <path d="M150 70 l5 14 14 5 -14 5 -5 14 -5 -14 -14 -5 14 -5z"/>
    <path d="M470 86 l3.5 9 9 3.5 -9 3.5 -3.5 9 -3.5 -9 -9 -3.5 9 -3.5z"/>
    <path d="M548 300 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z"/>
  </g>

  <!-- water glass (left) -->
  <g filter="url(#shadow)">
    <path d="M78 250 h70 l-8 150 a10 10 0 0 1 -10 9 h-34 a10 10 0 0 1 -10 -9z" fill="url(#glass)" stroke="#B9C7F5" stroke-width="3"/>
    <path d="M84 300 h58 l-5 98 a6 6 0 0 1 -6 5 h-36 a6 6 0 0 1 -6 -5z" fill="#BFD0FF" opacity="0.75"/>
    <circle cx="104" cy="335" r="5" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="120" cy="360" r="3.5" fill="#FFFFFF" opacity="0.8"/>
    <!-- lemon on rim -->
    <circle cx="146" cy="252" r="22" fill="#FFE27A" stroke="#F2C84B" stroke-width="3"/>
    <circle cx="146" cy="252" r="15" fill="#FFF3B8"/>
    <g stroke="#F2C84B" stroke-width="2">
      <line x1="146" y1="238" x2="146" y2="266"/><line x1="132" y1="252" x2="160" y2="252"/>
      <line x1="136" y1="242" x2="156" y2="262"/><line x1="156" y1="242" x2="136" y2="262"/>
    </g>
  </g>

  <!-- apple (right) -->
  <g filter="url(#shadow)">
    <path d="M478 300 c-30 -22 -78 -4 -72 46 c5 44 34 70 56 62 c8 -3 14 -3 22 0 c22 8 51 -18 56 -62 c6 -50 -42 -68 -62 -46z" fill="#FF8F7E"/>
    <path d="M430 330 c4 -16 16 -24 28 -24" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.55"/>
    <path d="M484 298 c0 -14 4 -24 12 -32" stroke="#6B4A3A" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M496 270 c18 -14 36 -10 42 -2 c-14 14 -30 14 -42 2z" fill="url(#leaf)"/>
  </g>

  <!-- bowl -->
  <g filter="url(#shadow)">
    <!-- greens peeking over -->
    <path d="M180 268 c-6 -50 40 -78 70 -52 c-30 6 -46 28 -44 56z" fill="url(#leaf)"/>
    <path d="M232 262 c4 -58 64 -74 84 -34 c-34 -2 -56 14 -62 40z" fill="url(#leaf2)"/>
    <path d="M330 260 c18 -54 84 -52 90 -6 c-30 -14 -62 -8 -78 12z" fill="url(#leaf)"/>
    <!-- avocado half -->
    <ellipse cx="300" cy="238" rx="38" ry="30" fill="#C9E39A" stroke="#6E9E45" stroke-width="5" transform="rotate(-12 300 238)"/>
    <circle cx="304" cy="240" r="14" fill="#A26B45"/>
    <circle cx="300" cy="236" r="4" fill="#C78D63"/>
    <!-- cherry tomatoes -->
    <circle cx="232" cy="250" r="17" fill="#FF6F61"/>
    <circle cx="227" cy="245" r="5" fill="#FFFFFF" opacity="0.5"/>
    <path d="M232 233 l-6 -6 M232 233 l6 -6 M232 233 v-8" stroke="#5FAE5A" stroke-width="3" stroke-linecap="round"/>
    <circle cx="372" cy="246" r="15" fill="#FF7F6F"/>
    <circle cx="368" cy="241" r="4.5" fill="#FFFFFF" opacity="0.5"/>
    <!-- egg slice -->
    <ellipse cx="262" cy="262" rx="20" ry="14" fill="#FFFFFF" stroke="#E9ECF5" stroke-width="2"/>
    <circle cx="262" cy="262" r="8" fill="#FFC94D"/>
    <!-- blueberries -->
    <circle cx="340" cy="266" r="8" fill="#4C5FC9"/>
    <circle cx="354" cy="270" r="7" fill="#3E51B8"/>
    <circle cx="327" cy="272" r="6.5" fill="#5A6DD6"/>
    <!-- bowl body -->
    <path d="M150 268 h300 c0 88 -66 146 -150 146 s-150 -58 -150 -146z" fill="url(#bowl)"/>
    <rect x="150" y="260" width="300" height="18" rx="9" fill="url(#bowlRim)"/>
    <path d="M190 300 c10 40 40 72 84 84" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.25"/>
    <ellipse cx="300" cy="420" rx="70" ry="9" fill="#2D47C9" opacity="0.35"/>
  </g>

  <!-- small dumbbell (fitness cue) -->
  <g transform="translate(232 452) rotate(-8)" opacity="0.9">
    <rect x="18" y="10" width="100" height="10" rx="5" fill="#9AA6C4"/>
    <rect x="0" y="0" width="18" height="30" rx="6" fill="#17213B"/>
    <rect x="118" y="0" width="18" height="30" rx="6" fill="#17213B"/>
  </g>
</svg>
