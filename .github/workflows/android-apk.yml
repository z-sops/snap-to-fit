name: Android test APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-apk.yml'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - 'plugins/**'
      - 'src/**'
permissions:
  contents: read
concurrency:
  group: android-test-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Generate Android native project
        run: npx expo prebuild --platform android --no-install
        env:
          EXPO_OFFLINE: '1'
      - name: Build standalone test APK (test signing only)
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a,x86_64 -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
      - name: Upload installable APK
        uses: actions/upload-artifact@v7
        with:
          name: snap-to-fit-test-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
